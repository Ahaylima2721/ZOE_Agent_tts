<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Zoe · apresentação</title>
<script>
/* câmera lenta na gravação: os temporizadores do JS são esticados aqui (o record_intro.js faz o mesmo nos iframes) */
window.__R = window.__R || (location.hash === '#rapido' ? 1 : 0.4);
(function (R) { const st = window.setTimeout, si = window.setInterval;
  window.setTimeout = (f, ms, ...a) => st(f, (ms || 0) / R, ...a);
  window.setInterval = (f, ms, ...a) => si(f, (ms || 0) / R, ...a); })(window.__R);
</script>
<link rel="stylesheet" href="www/zoe.css">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#160A33}
  #root{position:fixed;left:0;top:0;width:720px;height:1280px;transform:scale(1.5);transform-origin:0 0;overflow:hidden;
        font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#F4EEFF;
        background:radial-gradient(560px 480px at 85% 8%,rgba(139,92,246,.35),transparent 65%),
                   radial-gradient(520px 460px at 0% 95%,rgba(255,107,74,.14),transparent 65%),
                   linear-gradient(#1D0D42,#160A33 55%,#12082B)}
  #root::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.3px);background-size:20px 20px}

  /* topo (abaixo da área do perfil do Instagram) */
  .marca{position:absolute;left:44px;top:132px;font:600 12px/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:#C9A7FF;display:flex;gap:9px;align-items:center}
  .marca i{width:8px;height:8px;border-radius:50%;background:#A78BFA;box-shadow:0 0 10px #A78BFA}
  .manchete{position:absolute;left:44px;right:90px;top:154px;height:84px}
  .manchete h1{position:absolute;inset:0;margin:0;font-size:38px;line-height:1.05;letter-spacing:-.02em;font-weight:800;opacity:0;transform:translateY(-8px);transition:opacity .2s,transform .2s}
  .manchete h1.on{opacity:1;transform:none;transition:opacity .45s .1s,transform .5s .1s cubic-bezier(.3,1.3,.5,1)}
  .manchete h1 em{font-style:normal;color:#C9A7FF}

  /* celular */
  .cel{position:absolute;left:50%;top:244px;transform:translateX(-50%);width:288px;padding:10px;border-radius:44px;background:#0B0618;
       box-shadow:0 40px 90px -30px rgba(0,0,0,.8),0 0 0 1px rgba(201,167,255,.18) inset,0 0 80px -20px rgba(139,92,246,.45);transition:opacity .6s,transform .6s}
  .cel.some{opacity:0;transform:translateX(-50%) scale(.92)}
  .cel::before{content:"";position:absolute;left:50%;top:17px;transform:translateX(-50%);width:80px;height:20px;border-radius:12px;background:#0B0618;z-index:9}
  .tela{position:relative;width:268px;height:580px;border-radius:34px;overflow:hidden;background:#FAFAFA}
  .camada{position:absolute;inset:0;opacity:0;transition:opacity .35s}
  .camada.on{opacity:1}
  .tela iframe{position:absolute;left:0;top:0;width:390px;height:844px;border:0;transform:scale(.68718);transform-origin:0 0;background:transparent;pointer-events:none}

  /* feed genérico (sem marca de rede social) */
  .status{position:absolute;left:0;right:0;top:0;height:30px;display:flex;justify-content:space-between;align-items:center;padding:6px 22px 0;font:600 11px system-ui;color:#111;z-index:5;background:rgba(250,250,250,.92)}
  .feed{position:absolute;left:0;right:0;top:30px;animation:rola 16s linear infinite}
  .feed.parado{animation-play-state:paused}
  @keyframes rola{to{transform:translateY(-50%)}}
  .post{background:#fff;padding:8px 0 10px;display:flex;flex-direction:column;gap:7px;border-bottom:1px solid #EEE}
  .post .cab{display:flex;align-items:center;gap:7px;padding:0 9px}
  .post .cab i{width:22px;height:22px;border-radius:50%}
  .post .cab b{width:80px;height:7px;border-radius:4px;background:#DDD}
  .post .img{height:236px}
  .post .acoes{display:flex;gap:10px;padding:0 9px}.post .acoes i{width:16px;height:14px;border-radius:4px;background:#DDD}
  .post .txt{margin:0 9px;height:6px;border-radius:3px;background:#E6E6E6}
  .tempo{position:absolute;left:10px;top:40px;z-index:6;background:rgba(22,10,51,.82);color:#fff;font:600 11px system-ui;padding:5px 9px;border-radius:999px}

  /* bolinha da Zoe dentro do celular */
  #bolhaMini{position:absolute;right:6px;top:205px;display:flex;flex-direction:row-reverse;align-items:center;gap:7px;z-index:7;opacity:0;transform:translateX(70px) scale(.6)}
  #bolhaMini.on{opacity:1;transform:none;transition:transform .55s cubic-bezier(.3,1.5,.5,1),opacity .3s}
  #bolhaMini .bal{background:#fff;color:#1E1336;border-radius:14px 14px 3px 14px;padding:7px 10px;font:600 12px/1.3 system-ui;box-shadow:0 8px 20px -8px rgba(20,8,50,.6);max-width:150px}

  /* diálogo (acima da área dos botões do Instagram) */
  .dialogo{position:absolute;left:36px;right:84px;top:866px;height:160px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px}
  .msg{display:flex;align-items:flex-end;gap:9px;opacity:0;transform:translateY(12px);transition:opacity .3s,transform .4s cubic-bezier(.3,1.3,.5,1)}
  .msg.on{opacity:1;transform:none}
  .msg.velha{opacity:.42;transform:scale(.96);transform-origin:left bottom}
  .msg.voce{flex-direction:row-reverse}
  .msg .bal{max-width:500px;padding:10px 14px;font-size:19px;line-height:1.32;font-weight:600}
  .msg.zoe .bal{background:#EFE7FF;color:#1E1336;border-radius:18px 18px 18px 4px}
  .msg.voce .bal{background:#FFFFFF;color:#1E1336;border-radius:18px 18px 4px 18px}
  .msg .quem{font:700 11px/1 system-ui;letter-spacing:.06em;text-transform:uppercase;color:#C9A7FF;margin-bottom:4px;display:block}
  .msg.voce .quem{color:#8A80A6;text-align:right}
  .msg .av{width:42px;height:42px;flex:none}
  .msg .av-voce{display:grid;place-items:center;border-radius:50%;background:#2D1A5C;color:#C9A7FF}
  .msg .orb .eye{scale:1 calc(1 - var(--fala,0) * .5);translate:0 calc(var(--fala,0) * -12%)}

  /* final */
  .final{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding-bottom:140px;opacity:0;transition:opacity .8s;
         background:radial-gradient(520px 460px at 50% 40%,rgba(139,92,246,.45),transparent 70%),#160A33}
  .final.on{opacity:1}
  .final .orb .eye{scale:1 calc(1 - var(--fala,0) * .5);translate:0 calc(var(--fala,0) * -12%)}
  .final h2{margin:6px 0 0;font-size:84px;line-height:1;letter-spacing:-.02em}
  .final p{margin:0;font-size:24px;color:#C9A7FF;text-align:center}
  .final .selo{margin-top:10px;font:600 15px system-ui;padding:9px 16px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(201,167,255,.3)}
  .final .linha{display:flex;gap:10px;margin-top:6px}
  .final .linha span{font:600 15px system-ui;padding:8px 13px;border-radius:12px;background:#EFE7FF;color:#1E1336}

  /* barra de progresso */
  .prog{position:absolute;left:44px;right:90px;top:250px;height:0}
</style>
</head>
<body>
<div id="root">
  <div class="marca"><i></i>Zoe · app anti-procrastinação</div>
  <div class="manchete" id="manchete"></div>

  <div class="cel" id="cel"><div class="tela">
    <div class="camada on" id="cFeed">
      <div class="status"><span id="relogio">23:47</span><span>▮▮ 12%</span></div>
      <div class="feed" id="feed"></div>
      <span class="tempo" id="tempoTela">⏱ 2h 41min hoje</span>
      <div id="bolhaMini">
        <div class="orb" style="--s:46px"><div class="face"><i class="eye"></i><i class="eye"></i></div></div>
        <div class="bal">Ei, você aí!</div>
      </div>
      <div class="camada" id="cTopo"><iframe id="ifTopo" title="Aviso de rolagem"></iframe></div>
    </div>
    <div class="camada" id="cHoje"><iframe id="ifHoje" title="Tela Hoje"></iframe></div>
    <div class="camada" id="cPet"><iframe id="ifPet" title="Peteleco"></iframe></div>
    <div class="camada" id="cPil"><iframe id="ifPil" title="Pílula"></iframe></div>
  </div></div>

  <div class="dialogo" id="dialogo"></div>

  <div class="final" id="final">
    <div class="orb flutua feliz" id="orbFinal" style="--s:210px"><span class="bochecha e"></span><span class="bochecha d"></span><div class="face"><i class="eye"></i><i class="eye"></i></div></div>
    <h2>Zoe</h2>
    <p>Seu foco tem companhia.</p>
    <div class="linha"><span>hábitos</span><span>foco</span><span>peteleco</span><span>estudos</span></div>
    <div class="selo">cuidar de mim é cuidar de você</div>
  </div>
</div>
<script>
/*DADOS*/
(function () {
  const R = window.__R, $ = (s) => document.querySelector(s);

  // feed: duas cópias para rolar sem emenda
  const cores = [['#F2B8A0','#B89AE0'],['#9FD0C9','#C7B8F0'],['#F4E1A6','#F2C9D6'],['#C9E4F2','#8E7CC3'],['#DDE7C7','#F7D9C4'],['#E8CFE0','#9FC5E8']];
  const posts = cores.map(c => `<div class="post"><div class="cab"><i style="background:${c[1]}"></i><b></b></div><div class="img" style="background:linear-gradient(160deg,${c[0]},${c[1]})"></div><div class="acoes"><i></i><i></i><i></i></div><div class="txt" style="width:70%"></div><div class="txt" style="width:45%"></div></div>`).join('');
  $('#feed').innerHTML = posts + posts;

  // pílula: perguntas de exemplo já guardadas (a ponte falsa do app lê do localStorage)
  const d = new Date(), hoje = '' + d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
  try {
    localStorage.setItem('mock_est_trilhas', JSON.stringify([{ id: 'tpy', tipo: 'estudo', tema: 'Python', nivel: 'Intermediário', topico: 'listas', criada: hoje }]));
    localStorage.setItem('mock_est_perguntas', JSON.stringify([{ id: 'q1', trilha: 'tpy', tipo: 'codigo', pergunta: 'O que este código imprime?', codigo: 'print([x * 2 for x in range(3)])', dica: 'range(3) gera 0, 1 e 2.', resposta: '[0, 2, 4]', explicacao: 'A compreensão de lista aplica `x * 2` a cada número e junta tudo numa lista nova.', dificuldade: 1, fonte: { titulo: 'docs.python.org', url: 'https://docs.python.org/3/' }, caixa: 0, proxima: hoje, vezes: 0, acertos: 0 }]));
    localStorage.removeItem('mock_est_respostas'); localStorage.removeItem('mock_est_conversas');
  } catch (e) { }
  $('#ifPil').addEventListener('load', () => setTimeout(() => { try { $('#ifPil').contentWindow.zoeAbrir('pilula', false); } catch (e) { } }, 2600));
  $('#ifPil').src = 'www/index.html#demo';

  const camadas = { feed: '#cFeed', hoje: '#cHoje', peteleco: '#cPet', pilula: '#cPil' };
  function mostrarTela(t) {
    if (t === 'final') { $('#final').classList.add('on'); $('#cel').classList.add('some'); return; }
    Object.entries(camadas).forEach(([k, s]) => $(s).classList.toggle('on', k === t));
  }
  const clicar = (frame, sel) => { try { const el = $(frame).contentDocument.querySelector(sel); if (el) el.click(); } catch (e) { } };
  const acoes = {
    bolhaEntra: () => { $('#bolhaMini').classList.add('on'); $('#feed').classList.add('parado'); },
    carregarHoje: () => { $('#ifHoje').src = 'www/index.html#demo'; },
    peteleco: () => { $('#ifPet').src = 'www/peteleco.html?nivel=2&app=Instagram&ate=12:00&faltam=40&tom=firme&emerg=2&pergunta=1'; setTimeout(() => mostrarTela('peteleco'), 120); },
    topo: () => { $('#bolhaMini').classList.remove('on'); $('#feed').classList.remove('parado'); $('#ifTopo').src = 'www/bolha.html#topo'; setTimeout(() => $('#cTopo').classList.add('on'), 150); $('#relogio').textContent = '16:40'; $('#tempoTela').textContent = '⏱ 52 min hoje'; },
    revelar: () => clicar('#ifPil', '[data-acao=pilRevelar]'),
    acertei: () => clicar('#ifPil', '[data-acao=pilAcertei]'),
    habito: () => clicar('#ifHoje', '[data-acao=habito][aria-pressed=false]')
  };

  const voceIco = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>';
  function falaHtml(f) {
    const av = f.quem === 'zoe'
      ? '<div class="av"><div class="orb" style="--s:42px"><div class="face"><i class="eye"></i><i class="eye"></i></div></div></div>'
      : '<div class="av av-voce">' + voceIco + '</div>';
    return `<div class="msg ${f.quem}" data-id="${f.id}">${av}<div class="bal"><span class="quem">${f.quem === 'zoe' ? 'Zoe' : 'Você'}</span>${f.texto}</div></div>`;
  }

  let atual = -1, mancheteAtual = null;
  const feitos = new Set();
  function aplicar(i) {
    const f = FILME.falas[i];
    if (f.manchete !== mancheteAtual) {
      mancheteAtual = f.manchete;
      const m = $('#manchete'); m.querySelectorAll('h1').forEach(h => { h.classList.remove('on'); setTimeout(() => h.remove(), 400); });
      if (f.manchete) { const h = document.createElement('h1'); h.innerHTML = f.manchete; m.appendChild(h); setTimeout(() => h.classList.add('on'), 30); }
    }
    if (f.tela !== 'peteleco' || i === 0) mostrarTela(f.tela);
    if (f.tela === 'feed' && i > 0 && FILME.falas[i - 1].tela !== 'feed') { $('#cFeed').classList.add('on'); }
    const dlg = $('#dialogo');
    if (f.tela === 'final') { dlg.innerHTML = ''; return; }
    dlg.querySelectorAll('.msg').forEach((m, k, todos) => { if (k < todos.length - 1) m.remove(); else m.classList.add('velha'); });
    dlg.insertAdjacentHTML('beforeend', falaHtml(f));
    const novo = dlg.lastElementChild; setTimeout(() => novo.classList.add('on'), 20);
  }

  let t0 = 0;
  function quadro() {
    const vt = (performance.now() - t0) * R / 1000;
    let i = -1; FILME.falas.forEach((f, k) => { if (vt >= f.ini - 0.05) i = k; });
    if (i !== atual && i >= 0) { atual = i; aplicar(i); }
    FILME.falas.forEach(f => f.eventos.forEach(([te, a], k) => {
      const chave = f.id + k; if (vt >= te && !feitos.has(chave)) { feitos.add(chave); acoes[a](); }
    }));
    const e = FILME.env[Math.min(FILME.env.length - 1, Math.floor(vt * FILME.fps))] || 0;
    document.documentElement.style.setProperty('--fala', e.toFixed(2));
    if (vt >= FILME.total) { window.__acabou = true; return; }
    requestAnimationFrame(quadro);
  }
  window.iniciar = function () { t0 = performance.now(); window.__t0wall = Date.now(); requestAnimationFrame(quadro); };
  if (location.hash === '#rapido') setTimeout(window.iniciar, 3000);
})();
</script>
</body>
</html>
