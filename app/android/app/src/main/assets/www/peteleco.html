<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Peteleco</title>
<link rel="stylesheet" href="zoe.css">
<script src="zoe-anim.js"></script>
<style>
/* peteleco: uma folha de papel pêssego por cima do app vilão; no nível 3 a estufa fecha (noite) */
body{background-color:rgba(248,226,218,.97);background-image:var(--grao),radial-gradient(110% 70% at 50% 32%,rgba(252,237,231,.9),rgba(243,207,194,.9));color:var(--tinta);min-height:100%}
body.n3{background-color:rgba(34,29,51,.97);background-image:var(--grao),radial-gradient(120% 70% at 50% 28%,#3D3558 0%,rgba(34,29,51,.97) 62%);color:var(--noite-tinta)}
.tela{min-height:100vh;display:flex;flex-direction:column;padding:40px 24px 24px;gap:18px}
.passos{display:flex;justify-content:center;gap:8px}
.passos i{width:28px;height:7px;border-radius:0 7px 0 7px;background:rgba(169,80,58,.18)}
.passos i.on{background:var(--peteleco)}
.n3 .passos i{background:rgba(255,255,255,.18)}.n3 .passos i.on{background:var(--pessego)}
.palco{position:relative;display:flex;align-items:flex-end;justify-content:center;height:250px}
.palco .terra{position:absolute;left:-24px;right:-24px;bottom:8px;height:40px;width:calc(100% + 48px)}
.palco > .zoe{margin-bottom:20px;z-index:1}
.vidro{position:absolute;bottom:22px;left:50%;width:190px;height:200px;margin-left:-95px;border-radius:95px 95px 14px 14px;border:1.5px solid rgba(255,255,255,.4);
  background:linear-gradient(115deg,rgba(255,255,255,.18),rgba(255,255,255,.03) 40%,rgba(255,255,255,.08));z-index:2;animation:desce .9s .3s cubic-bezier(.3,1.2,.5,1) both}
@keyframes desce{from{transform:translateY(-140px);opacity:0}70%{opacity:1}to{transform:none}}
.titulo{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.titulo h1{font:800 30px/1.05 var(--f-titulo);letter-spacing:-.02em}
.titulo h1.mao{font:700 58px/1 var(--f-mao);color:var(--peteleco-escuro);letter-spacing:0}
.n3 .titulo h1{font-size:26px;line-height:1.15}
.fala{margin:0;font-size:18px;line-height:1.45;max-width:320px}
.chip{display:inline-block;font-size:13px;font-weight:600;color:var(--peteleco-escuro);background:rgba(233,154,134,.22);padding:6px 12px;border-radius:999px}
.acoes{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.btn{display:grid;place-items:center;min-height:56px;border-radius:18px;border:0;font:700 16.5px var(--f-texto);cursor:pointer;text-align:center;padding:0 16px}
.btn.principal{background:var(--tinta);color:#FFFFFF}
.n3 .btn.principal{background:var(--noite-tinta);color:var(--noite)}
.btn.texto{background:transparent;color:var(--peteleco-escuro);font-size:14.5px;font-weight:600;min-height:48px}
.n3 .btn.texto{color:var(--noite-suave)}
.btn.troca{background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 1.5px var(--lavanda);color:var(--lavanda-escura);font-size:15.5px}
.n3 .btn.troca{background:rgba(255,255,255,.08);color:#fff;box-shadow:inset 0 0 0 1.5px rgba(201,185,242,.5)}
.esgotada{margin:0;text-align:center;font-size:14px;color:var(--suave);padding:12px 0}
.n3 .esgotada{color:var(--noite-suave)}
.cadeado{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.1)}
.caixa{border-top:1.5px dashed rgba(255,255,255,.2);padding-top:12px;font-size:14px;line-height:1.5;color:var(--noite-suave)}
.caixa strong{color:#FFFFFF;display:block;margin-bottom:2px;font-size:15px}
@media (prefers-reduced-motion:reduce){.vidro{animation:none}}
</style>
</head>
<body>
<main id="tela" class="tela" role="alertdialog" aria-labelledby="titulo" aria-describedby="fala"></main>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var nivel = Math.min(3, Math.max(1, parseInt(q.get('nivel') || '1', 10)));
  var app = q.get('app') || 'esse app';
  var ate = q.get('ate') || '';
  var faltam = q.get('faltam') || '';
  var tom = q.get('tom') || 'firme';
  var emerg = parseInt(q.get('emerg') || '0', 10);
  var temPergunta = q.get('pergunta') === '1';

  var falas = {
    gentil: {
      1: ['Opa, acho que você abriu o {app} sem querer. Bora voltar?', 'Ei, ainda é hora do foco. Volta comigo?'],
      2: ['De novo o {app}? Tudo bem, acontece. Mas vamos voltar pro foco, tá?'],
      3: ['Faltam só {faltam} minutinhos. Você consegue, eu tô torcendo.']
    },
    firme: {
      1: ['Ei! A gente combinou foco até as {ate}. Volta pra tarefa!', 'Opa, opa. Ainda é hora do foco.'],
      2: ['De novo o {app}? Peteleco! A gente combinou foco até as {ate}.'],
      3: ['Faltam {faltam} minutos. Eu sei que você consegue.']
    },
    brava: {
      1: ['Não. Fecha o {app} agora.', 'Foco. Agora.'],
      2: ['DE NOVO?! Peteleco! Volta pro trabalho!'],
      3: ['Acabou. Nem tenta. Faltam {faltam} minutos.']
    }
  };
  function escolher(lista) { return lista[Math.floor(Math.random() * lista.length)]; }
  function preencher(t) { return t.replace(/\{app\}/g, app).replace(/\{ate\}/g, ate).replace(/\{faltam\}/g, faltam); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  var fala = preencher(escolher((falas[tom] || falas.firme)[nivel]));
  var orbe = function (humor, s) { return ZoeAnim.html(s, humor, { rotulo: 'Zoe ' + (humor === 'brava' ? 'brava' : 'séria') }); };
  var TERRA = '<svg class="terra" viewBox="0 0 360 40" preserveAspectRatio="none" aria-hidden="true"><path d="M0 14 C45 4 90 18 135 10 S225 2 270 12 S335 16 360 8 V40 H0Z" fill="' + (nivel === 3 ? 'rgba(185,166,216,.25)' : 'rgba(201,139,107,.28)') + '"/></svg>';
  var passos = '<div class="passos" role="img" aria-label="Tentativa ' + nivel + ' de 3">' +
    [1, 2, 3].map(function (i) { return '<i class="' + (i <= nivel ? 'on' : '') + '"></i>'; }).join('') + '</div>';

  var html;
  if (nivel === 1) {
    html = passos +
      '<div class="palco">' + TERRA + orbe('foco', 150) + '</div>' +
      '<div class="titulo"><h1 id="titulo">Ei, é hora da estufa</h1><p id="fala" class="fala">' + esc(fala) + '</p></div>' +
      '<div class="acoes"><button class="btn principal" id="ok">Tá bom, Zoe</button>' +
      '<button class="btn texto" id="emergencia">Preciso mesmo · 5 min</button></div>';
  } else if (nivel === 2) {
    html = passos +
      '<div class="palco">' + TERRA + orbe('brava', 160) + '</div>' +
      '<div class="titulo"><h1 id="titulo" class="mao">Peteleco!</h1><p id="fala" class="fala">' + esc(fala) + '</p>' +
      '<span class="chip">Energia da Zoe −5 · na próxima, o app fica lá fora</span></div>' +
      '<div class="acoes"><button class="btn principal" id="ok">Tá bom, Zoe</button>' +
      '<button class="btn texto" id="emergencia">Preciso mesmo · 5 min</button></div>';
  } else {
    html = passos +
      '<div class="palco"><div class="vidro"></div>' + TERRA + orbe('foco', 140) + '</div>' +
      '<div class="titulo"><span class="cadeado" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C9B9F2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>' +
      '<h1 id="titulo">' + esc(app) + ' fica lá fora até as ' + esc(ate) + '</h1><p id="fala" class="fala">' + esc(fala) + '</p></div>' +
      '<div class="caixa"><strong>Precisa mesmo?</strong>A emergência libera o app por 5 minutos. A Zoe perde 15 de energia e murcha um pouco, mas nunca te prende.</div>' +
      '<div class="acoes"><button class="btn principal" id="ok">Voltar para a tela inicial</button>' +
      '<button class="btn texto" id="emergencia">Usar emergência · 5 min</button></div>';
  }
  // Emergência: no máximo 2 por dia. Pergunta no lugar: só se já houver trilha de estudo.
  var trocar = temPergunta ? '<button class="btn troca" id="pergunta">Me dá uma pergunta no lugar</button>' : '';
  var sem = '<p class="esgotada">Emergências de hoje esgotadas. Amanhã tem mais duas.</p>';
  html = html.replace(/<button class="btn texto" id="emergencia">([^<]*)<\/button>/, function (m, txt) {
    return trocar + (emerg > 0 ? '<button class="btn texto" id="emergencia">' + txt + ' (' + emerg + (emerg === 1 ? ' restante' : ' restantes') + ')</button>' : sem);
  });
  document.getElementById('tela').innerHTML = html;
  if (nivel === 3) document.body.classList.add('n3');
  var zoe = document.querySelector('.palco .zoe');
  if (nivel === 1) ZoeAnim.tocar(zoe, 'desconfiada');
  if (nivel === 2) ZoeAnim.tocar(zoe, 'peteleco', { app: app }).then(function () { return ZoeAnim.tocar(zoe, 'brava'); });
  if (nivel === 3) setTimeout(function () { ZoeAnim.tocar(zoe, 'vigia'); }, 1300);
  ZoeAnim.vida({ gestos: function () { return nivel === 3 ? ['vigia'] : ['olhar']; } });

  var Z = window.Zoe || { ok: function () {}, emergencia: function () {}, pergunta: function () {} };
  document.getElementById('ok').onclick = function () { Z.ok(); };
  var b = document.getElementById('emergencia');
  if (b) b.onclick = function () { Z.emergencia(); };
  b = document.getElementById('pergunta');
  if (b) b.onclick = function () { Z.pergunta(); };
})();
</script>
</body>
</html>
